media: media

content:
  - name: pages
    label: Blog Posts
    type: collection
    path: docs
    fields:
      - name: title
        label: Title
        type: string

      - name: description
        label: Description
        type: string
        required: false

      - name: date
        label: Date
        type: date

      - name: category
        label: Category
        type: string

      - name: tags
        label: Tags
        type: string

      - name: body
        label: Content
        type: rich-text

      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"